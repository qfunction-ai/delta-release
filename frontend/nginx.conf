server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Rate limiting — zone defined in nginx-main.conf http block
    limit_req zone=general burst=30 nodelay;

    # Max upload size for API proxy (skills, tools, imports)
    client_max_body_size 10m;

    # Security headers (shared include — also used in /assets/ location)
    include /etc/nginx/security-headers.conf;

    # Block source map files from being served
    location ~* \.map$ {
        deny all;
        log_not_found off;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (Vite hashes filenames, so immutable is safe)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-include security headers — nginx drops parent add_header in child locations
        include /etc/nginx/security-headers.conf;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Access log buffering — reduces I/O overhead for high-traffic deployments
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
}
