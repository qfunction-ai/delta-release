# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' for offline mode
# offline_mode = false

# set to 'true' to run environment context
# during migration as dry-run
# dry_run = false

# version location specification
# version_locations = migrations

# version path separator
# version_path_separator = :

# set to 'true' to allow .pyc files
# include_pyc = false

# database URL. This is overridden by config value in env.py
# sqlalchemy.url = postgresql://delta:delta@localhost:5432/delta

[post_write_hooks]
# post_write_hooks defined here

# NOTE: No [loggers] section. Alembic calls logging.config.fileConfig()
# when a [loggers] section exists, and fileConfig defaults to
# disable_existing_loggers=True — which silently disables every logger
# not listed here (including "app"). That kills the RotatingFileHandler
# on the "app" logger, and all runtime log messages stop writing to
# /data/logs/backend.log. Without this section, Alembic's log messages
# propagate through the normal logging hierarchy instead.
