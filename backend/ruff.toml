target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",   # module-level import not at top (logger-before-imports pattern)
    "F821",   # undefined name (forward references in type annotations)
    "E501",   # line too long (long string literals in prompts, test data, error messages)
]

[lint.isort]
# `shared` must be explicit: the backend image copies shared/ into /app, so
# in-container ruff classifies it as first-party (src=".") while a host-side
# run from backend/ classifies it as third-party — same version, different
# I001 result. Pin the classification so both agree.
known-first-party = ["app", "shared"]
